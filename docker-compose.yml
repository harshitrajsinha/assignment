services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_DB: ${DATABASE_DB}
      DATABASE_PASS: ${DATABASE_PASS}               # Not to be used in production as it will reflect in docker inspect
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL}   
      LLM_GATEWAY_TIMEOUT: ${LLM_GATEWAY_TIMEOUT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}             # Not to be used in production as it will reflect in docker inspect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      llmgen:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - assignment-qna


  llmgen:
    build:
      context: ./generation
      dockerfile: Dockerfile
    container_name: llmgen
    ports:
      - "8001:8001"
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}       # Not to be used in production as it will reflect in docker inspect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - assignment-qna
  
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}     # Not to be used in production as it will reflect in docker inspect
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - assignment-qna

volumes:
  postgres_data:

networks:
  assignment-qna:
    driver: bridge
